name: Run News_crawler.yml

on:
  # 自動排程：每天台灣時間早上 08:30 自動執行 (UTC 00:30)
  schedule:
    - cron: '30 0 * * *'
  # 保留手動按鈕觸發
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pandas feedparser beautifulsoup4 line-bot-sdk

      - name: Run crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python DailyNews_crawler.py
