name: Run Gemini Crawler
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # 必須大於等於 3.12
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
        pip install "numpy<2.0" pandas pandas_ta twstock yfinance requests feedparser beautifulsoup4 google-genai line-bot-sdk
      - name: Run crawler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python Gemini_crawler.py
